<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>R1 MOTOBOY - PAINEL DO ENTREGADOR</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E30613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #E30613;
      --bg-main: #090A0C;
      --bg-card: #121418;
      --bg-input: #0A0B0E;
      --text-main: #FFFFFF;
      --text-muted: #A0A0A0;
      --border-dark: #222630;
      --radius: 16px;
      --green: #00E676;
      --orange: #FF9800;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 30px; }

    header { background: var(--bg-main); border-bottom: 1px solid var(--border-dark); padding: 14px 16px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo-box { width: 34px; height: 34px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }

    .hidden { display: none !important; }

    /* TELA DE LOGIN */
    .login-box { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 24px; margin-top: 30px; text-align: center; }
    .input-group { margin: 16px 0; text-align: left; }
    .input-label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .input-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border-dark); border-radius: 12px; padding: 14px; color: #FFF; font-size: 0.95rem; outline: none; }
    .input-control:focus { border-color: var(--primary); }
    .btn-login { width: 100%; background: var(--primary); color: #FFF; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; }

    /* PAINEL LOGADO */
    .status-panel { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .btn-status-toggle { padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-status-toggle.online { background: rgba(0, 230, 118, 0.15); border: 1px solid var(--green); color: var(--green); }
    .btn-status-toggle.offline { background: rgba(255, 152, 0, 0.15); border: 1px solid var(--orange); color: var(--orange); }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .metric-card { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: 14px; padding: 14px; text-align: center; }
    .metric-val { font-size: 1.3rem; font-weight: 900; color: #FFF; margin-top: 4px; }
    .metric-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    .card-corrida { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .card-corrida.em-rota { border-color: var(--orange); box-shadow: 0 0 15px rgba(255, 152, 0, 0.15); }
    .badge-status { background: var(--orange); color: #000; font-size: 0.7rem; font-weight: 800; padding: 3px 8px; border-radius: 8px; }

    .tl-box { position: relative; padding-left: 20px; margin: 14px 0; }
    .tl-box::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--border-dark); }
    .tl-row { position: relative; margin-bottom: 10px; }
    .tl-row:last-child { margin-bottom: 0; }
    .tl-bullet { position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; }
    .tl-bullet.red { background: var(--primary); }
    .tl-bullet.green { background: var(--green); }

    .btn-gps { background: var(--green); color: #000; border: none; border-radius: 12px; padding: 14px; font-weight: 900; font-size: 0.95rem; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-top: 12px; }
    .empty-box { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 30px 16px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo-box">R1</div>
      <div>
        <span style="font-weight:900; font-size:1.1rem; color:var(--primary); font-style:italic;">R1 <span style="color:#FFF;">MOTOBOY</span></span>
        <span style="font-size:0.6rem; color:var(--text-muted); display:block; margin-top:-4px;">ÁREA DO ENTREGADOR</span>
      </div>
    </div>
    <div id="header-user-status" class="hidden" style="font-size:0.75rem; color:var(--text-muted);">
      <button onclick="sairConta()" style="background:transparent; border:1px solid var(--border-dark); color:var(--text-muted); padding:4px 8px; border-radius:6px; font-size:0.7rem; cursor:pointer;">Sair</button>
    </div>
  </header>

  <div class="container">

    <!-- TELA 1: AUTENTICAÇÃO DO ENTREGADOR -->
    <div id="tela-login" class="login-box">
      <div style="font-size:2rem; color:var(--primary); margin-bottom:8px;"><i class="fa-solid fa-motorcycle"></i></div>
      <h2 style="font-size:1.1rem; font-weight:900;">Acesso do Entregador</h2>
      <p style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">Informe seus dados para acessar suas corridas</p>

      <div class="input-group">
        <label class="input-label">WhatsApp ou CPF Cadastrado</label>
        <input type="tel" id="login-identificador" class="input-control" placeholder="Digite apenas números (Ex: 18999998888)">
      </div>

      <button type="button" class="btn-login" onclick="realizarLoginMotoboy()">
        <i class="fa-solid fa-right-to-bracket"></i> Acessar Minha Conta
      </button>
    </div>

    <!-- TELA 2: PAINEL EXCLUSIVO DO ENTREGADOR AUTENTICADO -->
    <div id="tela-painel" class="hidden">
      <div class="status-panel">
        <div>
          <div style="font-weight:800; font-size:0.95rem;" id="mb-nome-display">--</div>
          <div style="font-size:0.72rem; color:var(--text-muted);" id="mb-moto-display">--</div>
        </div>
        <button class="btn-status-toggle online" id="btn-status" onclick="alternarDisponibilidade()">
          <i class="fa-solid fa-circle"></i> <span id="status-txt">ONLINE</span>
        </button>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Meu Repasse Total</div>
          <div class="metric-val" style="color:var(--green);" id="mb-faturamento-total">R$ 0,00</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Entregas Realizadas</div>
          <div class="metric-val" id="mb-entregas-qtd">0</div>
        </div>
      </div>

      <div style="font-size:0.85rem; font-weight:800; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
        <span>CHAMADOS EM ANDAMENTO</span>
        <i class="fa-solid fa-bell" style="color:var(--orange);"></i>
      </div>

      <div id="box-corrida-ativa"></div>

      <div style="font-size:0.85rem; font-weight:800; margin:20px 0 10px 0;">MEU HISTÓRICO DE ENTREGAS</div>
      <div id="lista-historico-motoboy"></div>
    </div>

  </div>

  <script>
    let motoboyLogado = null;

    window.onload = function() {
      verificarSessaoSalva();
    };

    function verificarSessaoSalva() {
      const sessaoId = localStorage.getItem('r1_sessao_motoboy_id');
      if (sessaoId) {
        validarIdentificador(sessaoId);
      }
    }

    function realizarLoginMotoboy() {
      const input = document.getElementById('login-identificador').value.replace(/\D/g, '');
      if (!input || input.length < 8) {
        return alert("Digite um WhatsApp ou CPF válido cadastrado na Central.");
      }
      validarIdentificador(input);
    }

    function validarIdentificador(identificador) {
      const baseMotoboys = JSON.parse(localStorage.getItem('r1_motoboys_data') || '[]');
      
      const mbEncontrado = baseMotoboys.find(m => {
        const whatsLimpo = (m.whats || '').replace(/\D/g, '');
        const cpfLimpo = (m.cpf || '').replace(/\D/g, '');
        return whatsLimpo === identificador || cpfLimpo === identificador;
      });

      if (mbEncontrado) {
        motoboyLogado = mbEncontrado;
        localStorage.setItem('r1_sessao_motoboy_id', identificador);
        carregarPainelLogado();
      } else {
        alert("Entregador não encontrado. Solicite o cadastro na Central R1AMOBI.");
      }
    }

    function carregarPainelLogado() {
      document.getElementById('tela-login').classList.add('hidden');
      document.getElementById('tela-painel').classList.remove('hidden');
      document.getElementById('header-user-status').classList.remove('hidden');

      document.getElementById('mb-nome-display').innerText = motoboyLogado.nome;
      document.getElementById('mb-moto-display').innerText = `${motoboyLogado.modelo || 'Moto'} • ${motoboyLogado.placa || 'Sem placa'}`;

      const btnStatus = document.getElementById('btn-status');
      const isOnline = (motoboyLogado.status || 'online') === 'online';
      btnStatus.className = isOnline ? "btn-status-toggle online" : "btn-status-toggle offline";
      document.getElementById('status-txt').innerText = isOnline ? "ONLINE" : "PAUSADO";

      atualizarEntregasEMetricas();
    }

    function alternarDisponibilidade() {
      let baseMotoboys = JSON.parse(localStorage.getItem('r1_motoboys_data') || '[]');
      const index = baseMotoboys.findIndex(m => m.nome === motoboyLogado.nome);

      if (index >= 0) {
        const novoStatus = baseMotoboys[index].status === 'online' ? 'pausado' : 'online';
        baseMotoboys[index].status = novoStatus;
        motoboyLogado.status = novoStatus;
        localStorage.setItem('r1_motoboys_data', JSON.stringify(baseMotoboys));

        const btnStatus = document.getElementById('btn-status');
        btnStatus.className = novoStatus === 'online' ? "btn-status-toggle online" : "btn-status-toggle offline";
        document.getElementById('status-txt').innerText = novoStatus === 'online' ? "ONLINE" : "PAUSADO";
      }
    }

    function atualizarEntregasEMetricas() {
      const baseOrdens = JSON.parse(localStorage.getItem('r1_ordens_data') || '[]');
      
      const minhasOrdens = baseOrdens.filter(r => 
        r.motoboyNome === motoboyLogado.nome || 
        (r.motoboyIdx !== "" && baseMotoboys[r.motoboyIdx] && baseMotoboys[r.motoboyIdx].nome === motoboyLogado.nome)
      );

      const ativa = minhasOrdens.find(r => !r.concluido);
      const concluidas = minhasOrdens.filter(r => r.concluido);

      const totalRepasse = concluidas.reduce((acc, r) => acc + (r.repasseLiquido !== undefined ? r.repasseLiquido : r.val), 0);
      document.getElementById('mb-faturamento-total').innerText = `R$ ${totalRepasse.toFixed(2)}`;
      document.getElementById('mb-entregas-qtd').innerText = concluidas.length;

      const boxAtiva = document.getElementById('box-corrida-ativa');
      if (ativa) {
        let pontos = [ativa.orig, ...(ativa.paradasExtras || []), ativa.dest];
        let linkRotaGPS = `https://www.google.com/maps/dir/` + pontos.map(p => encodeURIComponent(p)).join('/');

        boxAtiva.innerHTML = `
          <div class="card-corrida em-rota">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="badge-status">DESPACHO ATIVO</span>
              <span style="font-size:0.8rem; font-weight:800;">OS #${ativa.numOS}</span>
            </div>

            <div style="font-size:0.95rem; font-weight:900; margin-top:10px; color:#FFF;">Cliente: ${ativa.cli}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);"><i class="fa-solid fa-phone"></i> ${ativa.whats || 'Sem telefone'}</div>

            <div class="tl-box">
              <div class="tl-row">
                <div class="tl-bullet red"></div>
                <div style="font-size:0.7rem; font-weight:700; color:var(--primary);">COLETA</div>
                <div style="font-size:0.8rem;">${ativa.orig}</div>
              </div>
              <div class="tl-row">
                <div class="tl-bullet green"></div>
                <div style="font-size:0.7rem; font-weight:700; color:var(--green);">ENTREGA</div>
                <div style="font-size:0.8rem;">${ativa.dest}</div>
              </div>
            </div>

            <div style="background:rgba(255,255,255,0.04); padding:10px; border-radius:10px; margin:10px 0; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:0.65rem; color:var(--text-muted);">SEU REPASSE LÍQUIDO</div>
                <div style="font-size:1.1rem; font-weight:900; color:var(--green);">R$ ${(ativa.repasseLiquido !== undefined ? ativa.repasseLiquido : ativa.val).toFixed(2)}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:0.65rem; color:var(--text-muted);">FORMA DE PGTO</div>
                <div style="font-size:0.8rem; font-weight:800; color:#FFF;">${ativa.pag || 'PIX'}</div>
              </div>
            </div>

            <button class="btn-gps" onclick="window.open('${linkRotaGPS}', '_blank')">
              <i class="fa-solid fa-location-arrow"></i> ABRIR ROTA NO GPS
            </button>
          </div>
        `;
      } else {
        boxAtiva.innerHTML = `
          <div class="empty-box card-corrida">
            <i class="fa-solid fa-hourglass-half" style="font-size:1.8rem; margin-bottom:8px; color:var(--text-muted);"></i>
            <div>Nenhum chamado ativo no momento para você.</div>
          </div>
        `;
      }

      const histEl = document.getElementById('lista-historico-motoboy');
      if (concluidas.length === 0) {
        histEl.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.75rem; padding:12px;">Nenhuma entrega concluída até o momento.</div>`;
      } else {
        histEl.innerHTML = concluidas.map(r => `
          <div style="background:var(--bg-card); border:1px solid var(--border-dark); border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:700; font-size:0.8rem;">OS #${r.numOS} • ${r.cli}</div>
              <div style="font-size:0.68rem; color:var(--text-muted);">${r.dtStr}</div>
            </div>
            <div style="color:var(--green); font-weight:900; font-size:0.9rem;">+ R$ ${(r.repasseLiquido !== undefined ? r.repasseLiquido : r.val).toFixed(2)}</div>
          </div>
        `).join('');
      }
    }

    function sairConta() {
      localStorage.removeItem('r1_sessao_motoboy_id');
      location.reload();
    }
  </script>
</body>
</html>
