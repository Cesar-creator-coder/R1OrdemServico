<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- ... (Tags PWA e Ícones mantidas iguais) ... -->
  <style>
    /* ... (Estilos PWA mantidos iguais) ... */
    /* NOVOS ESTILOS PARA TELA DE LOGIN SEGURO */
    .login-box { /* ... (Manter estilo anterior) ... */ }
    .input-label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: block; text-align: left;}
  </style>
</head>
<body>

  <!-- ... (Header mantido igual) ... -->

  <div class="container">

    <!-- TELA 1: LOGIN SEGURO (ATUALIZADA) -->
    <div id="tela-login" class="login-box">
      <div style="font-size:2.5rem; color:var(--primary); margin-bottom:12px;"><i class="fa-solid fa-lock"></i></div>
      <h2 style="font-size:1.2rem; font-weight:900;">Acesso Seguro R1AMOBI</h2>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Informe seu E-mail e Senha pessoal.</p>
      
      <div class="input-group">
        <label class="input-label">Seu E-mail Cadastrado</label>
        <input type="email" id="login-email" class="input-control" placeholder="ex: joo@r1.com">
      </div>
      
      <div class="input-group" style="margin-top: 10px;">
        <label class="input-label">Sua Senha Pessoal</label>
        <input type="password" id="login-senha" class="input-control" placeholder="******">
      </div>

      <button type="button" class="btn-login" style="margin-top: 15px;" onclick="realizarLoginSeguro()"><i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel</button>
    </div>

    <!-- ... (TELA 2: PAINEL mantido igual) ... -->

  </div>

  <!-- SCRIPTS -->
  <!-- ... (Firebase App Compat e Database Compat mantidos iguais) ... -->
  <!-- NOVO SCRIPT PARA AUTHENTICATION -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script> 

  <script>
    let motoboyLogado = null;
    let db = null;
    let auth = null; // Nova variável para Authentication

    window.onload = function() {
      if (typeof firebaseConfig !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        auth = firebase.auth(); // Inicializa Auth
      } else {
        console.error("Configuração do Firebase não encontrada.");
      }
      verificarSessaoSalva();
      // ... (Restante do onload mantido) ...
    };

    // ... (Funções de sessão e login antigo removidas) ...

    // NOVA FUNÇÃO DE LOGIN SEGURO COM E-MAIL E SENHA
    function realizarLoginSeguro() {
        const email = document.getElementById('login-email').value;
        const senha = document.getElementById('login-senha').value;

        if (!email || !senha) return alert("Preencha E-mail e Senha.");

        auth.signInWithEmailAndPassword(email, senha)
            .then((userCredential) => {
                // Login com sucesso no Firebase Auth
                const user = userCredential.user;
                
                // Agora buscamos os dados dele no Realtime Database (para saber o nome, moto, etc.)
                // Vamos usar o UID do Auth para buscar no DB (método mais seguro)
                db.ref('motoboys').orderByChild('uid').equalTo(user.uid).once('value').then((snapshot) => {
                    let mbDados = null;
                    snapshot.forEach((child) => { mbDados = child.val(); mbDados.idFB = child.key; });
                    
                    if (mbDados) {
                        loginSucesso(mbDados, user.email);
                    } else {
                        // Se não achar no DB, algo está errado no cadastro da Central
                        alert("Erro grave: E-mail autenticado mas dados do motoboy não encontrados no banco. Contate a Central.");
                        auth.signOut(); // Desloga
                    }
                });
            })
            .catch((error) => {
                // Erro de login (senha errada, e-mail não existe, etc.)
                alert("Erro de login: E-mail ou senha incorretos.");
                console.error(error);
            });
    }

    function loginSucesso(motoboy, email) {
      motoboyLogado = motoboy;
      localStorage.setItem('r1_sessao_motoboy_email', email); // Salva e-mail na sessão
      // ... (Restauração da tela igual ao anterior) ...
    }

    // ... (Restante do código mantido igual: status, métricas, chamados, histórico com ações de apagar/editar) ...

    function sairConta() {
      auth.signOut(); // Desloga do Firebase Auth
      localStorage.removeItem('r1_sessao_motoboy_email');
      location.reload();
    }
  </script>
</body>
</html>
