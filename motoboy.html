<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>R1 MOTOBOY - Central do Entregador</title>

  <!-- ======================================================= -->
  <!-- CONFIGURAÇÕES DE APLICATIVO INSTALÁVEL (PWA)           -->
  <!-- ======================================================= -->
  <link rel="manifest" href="manifest-motoboy.json">
  <meta name="theme-color" content="#E30613">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="R1 Motoboy">
  <link rel="icon" type="image/png" href="./icon-motoboy.png">
  <link rel="apple-touch-icon" href="./icon-motoboy.png">
  <!-- ======================================================= -->

  <!-- FontAwesome & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #E30613;
      --bg-main: #090A0C;
      --bg-card: #121418;
      --bg-input: #0A0B0E;
      --text-main: #FFFFFF;
      --text-muted: #A0A0A0;
      --border-dark: #222630;
      --radius: 16px;
      --green: #00E676;
      --orange: #FF9800;
      --red: #FF5252;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }

    header { background: var(--bg-main); border-bottom: 1px solid var(--border-dark); padding: 14px 16px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo-box { width: 34px; height: 34px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .hidden { display: none !important; }

    /* TELA DE LOGIN */
    .login-box { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 24px; margin-top: 30px; text-align: center; }
    .input-group { margin: 16px 0; text-align: left; }
    .input-control { width: 100%; background: var(--bg-input); border: 1px solid var(--border-dark); border-radius: 12px; padding: 14px; color: #FFF; font-size: 0.95rem; outline: none; }
    .input-control:focus { border-color: var(--primary); }
    .btn-login { width: 100%; background: var(--primary); color: #FFF; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; }

    /* PAINEL LOGADO */
    .status-panel { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .btn-status-toggle { padding: 10px 18px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-status-toggle.online { background: rgba(0, 230, 118, 0.15); border: 1px solid var(--green); color: var(--green); }
    .btn-status-toggle.offline { background: rgba(255, 152, 0, 0.15); border: 1px solid var(--orange); color: var(--orange); }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .metric-card { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: 14px; padding: 14px; text-align: center; }
    .metric-val { font-size: 1.3rem; font-weight: 900; margin-top: 4px; }

    /* CARDS DE CHAMADOS */
    .card-oferta { background: #161922; border: 2px solid var(--primary); border-radius: var(--radius); padding: 18px; animation: pulseBorder 1.5s infinite alternate; }
    @keyframes pulseBorder { from { border-color: var(--primary); box-shadow: 0 0 15px rgba(227, 6, 19, 0.3); } to { border-color: var(--orange); box-shadow: 0 0 30px rgba(255, 152, 0, 0.5); } }

    .btn-aceitar { background: var(--green); color: #000; border: none; border-radius: 12px; padding: 16px; font-weight: 900; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-recusar { background: rgba(255, 82, 82, 0.15); border: 1px solid var(--red); color: var(--red); border-radius: 12px; padding: 14px; width: 100%; cursor: pointer; margin-top: 8px; border: 1px solid var(--red); }

    /* HISTÓRICO - ESTILO ATUALIZADO COM AÇÕES */
    .filter-panel { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 14px; margin: 20px 0 12px 0; }
    .filter-select { width: 100%; background: var(--bg-input); border: 1px solid var(--border-dark); border-radius: 10px; padding: 10px; color: #FFF; font-size: 0.85rem; font-weight: 700; outline: none; margin-top: 6px; }

    .card-historico { background: var(--bg-card); border: 1px solid var(--border-dark); border-radius: 12px; padding: 12px; margin-bottom: 8px; position: relative; }
    .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #1A1D24; padding-bottom: 6px; }
    .hist-os { font-weight: 800; font-size: 0.85rem; }
    .hist-data { font-size: 0.7rem; color: var(--text-muted); }
    
    .hist-body { display: flex; justify-content: space-between; align-items: center; }
    .hist-cli { font-size: 0.82rem; font-weight: 600; }
    .hist-val { color: var(--green); font-weight: 900; font-size: 1rem; }

    /* BOTÕES DE AÇÃO NO HISTÓRICO (SOLICITADO) */
    .hist-actions { margin-top: 8px; border-top: 1px solid #1A1D24; padding-top: 8px; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-action { background: transparent; border: 1px solid var(--border-dark); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .btn-action.btn-edit:hover { border-color: var(--orange); color: var(--orange); }
    .btn-action.btn-delete:hover { border-color: var(--red); color: var(--red); }

    /* ESTILO DO FORMULÁRIO DE EDIÇÃO DENTRO DO CARD */
    .edit-form { margin-top: 8px; background: var(--bg-input); border-radius: 10px; padding: 10px; border: 1px solid var(--border-dark); }
    .edit-form-input { width: 100%; background: #000; border: 1px solid #222; border-radius: 8px; padding: 8px; color: #FFF; margin-bottom: 6px; font-size: 0.85rem; }
    .edit-form-btns { display: flex; gap: 6px; }
    .btn-edit-save { background: var(--green); color: #000; border: none; padding: 8px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; flex: 1; cursor: pointer; }
    .btn-edit-cancel { background: rgba(255,255,255,0.05); color: #FFF; border: 1px solid var(--border-dark); padding: 8px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; flex: 1; cursor: pointer; }

    .tl-box { position: relative; padding-left: 20px; margin: 14px 0; }
    .tl-row { position: relative; margin-bottom: 10px; }
    .tl-bullet { position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--border-dark); }
    .empty-box { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 30px 16px; border-radius: 12px; border: 1px solid var(--border-dark); }

  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo-box">R1</div>
      <div><span style="font-weight:900; font-size:1.1rem; color:var(--primary); font-style:italic;">R1 <span style="color:#FFF;">MOTOBOY</span></span><span style="font-size:0.6rem; color:var(--text-muted); display:block; margin-top:-4px;">CENTRAL DO ENTREGADOR</span></div>
    </div>
    <div id="header-user-status" class="hidden">
      <button onclick="sairConta()" style="background:transparent; border:1px solid var(--border-dark); color:var(--text-muted); padding:6px 12px; border-radius:8px; font-size:0.7rem; cursor:pointer;">Sair <i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </header>

  <div class="container">

    <!-- TELA 1: LOGIN -->
    <div id="tela-login" class="login-box">
      <div style="font-size:2.5rem; color:var(--primary); margin-bottom:12px;"><i class="fa-solid fa-motorcycle"></i></div>
      <h2 style="font-size:1.2rem; font-weight:900;">Acesso R1AMOBI</h2>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Informe seu WhatsApp cadastrado</p>
      <div class="input-group">
        <input type="tel" id="login-identificador" class="input-control" placeholder="18999998888">
      </div>
      <button type="button" class="btn-login" onclick="realizarLoginMotoboy()"><i class="fa-solid fa-right-to-bracket"></i> Acessar Minha Conta</button>
    </div>

    <!-- TELA 2: PAINEL DO ENTREGADOR -->
    <div id="tela-painel" class="hidden">
      
      <!-- STATUS -->
      <div class="status-panel">
        <div>
          <div style="font-weight:800;" id="mb-nome-display">--</div>
          <div style="font-size:0.7rem; color:var(--text-muted);" id="mb-moto-display">--</div>
        </div>
        <button class="btn-status-toggle online" id="btn-status" onclick="alternarDisponibilidade()">
          <i class="fa-solid fa-circle"></i> <span id="status-txt">ONLINE</span>
        </button>
      </div>

      <!-- MÉTRICAS -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div style="font-size:0.7rem; color:var(--text-muted); font-weight:700;">Repasse Hoje</div>
          <div class="metric-val" style="color:var(--green);" id="mb-faturamento-total">R$ 0,00</div>
        </div>
        <div class="metric-card">
          <div style="font-size:0.7rem; color:var(--text-muted); font-weight:700;">Corridas Hoje</div>
          <div class="metric-val" id="mb-entregas-qtd">0</div>
        </div>
      </div>

      <!-- CHAMADOS ATIVOS -->
      <div id="box-chamados-dinamicos"></div>

      <!-- HISTÓRICO COM EXTRATO E AÇÕES (SOLICITADO) -->
      <div class="filter-panel">
        <div style="font-size:0.8rem; font-weight:800; display:flex; justify-content:space-between; align-items:center;">
          <span><i class="fa-solid fa-file-invoice-dollar" style="color:var(--green);"></i> HISTÓRICO & EXTRATO</span>
        </div>
        <select id="mb-filtro-periodo" class="filter-select" onchange="atualizarEntregasEMetricas()">
          <option value="hoje">📅 Hoje</option>
          <option value="todos">📂 Tudo (Baixar PDF Completo)</option>
        </select>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
          <button onclick="gerarPDFExtratoMotoboy()" style="background:transparent; border:1px solid var(--border-dark); color:#FFF; padding:10px; border-radius:10px; font-size:0.75rem; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
            <i class="fa-solid fa-file-pdf" style="color:var(--primary);"></i> Baixar PDF
          </button>
          <button onclick="enviarWhatsExtratoMotoboy()" style="background:#25D366; border:none; color:#000; padding:10px; border-radius:10px; font-size:0.75rem; font-weight:900; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
            <i class="fa-brands fa-whatsapp"></i> Meu WhatsApp
          </button>
        </div>
      </div>

      <!-- LISTA DO HISTÓRICO -->
      <div id="lista-historico-motoboy"></div>

    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script> 

  <script>
    let motoboyLogado = null;
    let db = null;
    let ordensNoHistorico = []; // Guarda as ordens processadas

    window.onload = function() {
      if (typeof firebaseConfig !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      } else {
        console.error("Configuração do Firebase não encontrada.");
      }
      verificarSessaoSalva();
      setInterval(atualizarEntregasEMetricas, 5000); // Atualiza a cada 5 seg
    };

    function verificarSessaoSalva() {
      const sessaoId = localStorage.getItem('r1_sessao_motoboy_whats');
      if (sessaoId) validarIdentificador(sessaoId);
    }

    function realizarLoginMotoboy() {
      const input = document.getElementById('login-identificador').value.replace(/\D/g, '');
      if (input.length < 10) return alert("Digite seu WhatsApp com DDD completo.");
      validarIdentificador(input);
    }

    function validarIdentificador(whats) {
      if (!db) return;
      db.ref('motoboys').once('value').then((snapshot) => {
        const data = snapshot.val();
        let mbEncontrado = null;
        if (data) {
          for (let key in data) {
            if ((data[key].whats || '').replace(/\D/g, '') === whats) { mbEncontrado = data[key]; mbEncontrado.idFB = key; break; }
          }
        }
        if (mbEncontrado) { loginSucesso(mbEncontrado, whats); } else { alert("Entregador não encontrado. Cadastre-se na Central R1AMOBI."); sairConta(); }
      });
    }

    function loginSucesso(motoboy, whats) {
      motoboyLogado = motoboy;
      localStorage.setItem('r1_sessao_motoboy_whats', whats);
      document.getElementById('tela-login').classList.add('hidden');
      document.getElementById('tela-painel').classList.remove('hidden');
      document.getElementById('header-user-status').classList.remove('hidden');
      document.getElementById('mb-nome-display').innerText = motoboyLogado.nome;
      document.getElementById('mb-moto-display').innerText = `${motoboyLogado.modelo || 'Moto'} • ${motoboyLogado.placa || 'Sem Placa'}`;
      
      db.ref('motoboys/' + motoboyLogado.idFB + '/status').on('value', (snap) => {
          const status = snap.val() || 'offline';
          const btnStatus = document.getElementById('btn-status');
          if(status === 'online'){
              btnStatus.className = "btn-status-toggle online";
              document.getElementById('status-txt').innerText = "ONLINE";
          } else {
              btnStatus.className = "btn-status-toggle offline";
              document.getElementById('status-txt').innerText = "PAUSADO";
          }
      });
      atualizarEntregasEMetricas();
    }

    function alternarDisponibilidade() {
      if (!db || !motoboyLogado) return;
      const snap = document.getElementById('status-txt').innerText;
      const novoStatus = snap === 'ONLINE' ? 'offline' : 'online';
      db.ref('motoboys/' + motoboyLogado.idFB).update({ status: novoStatus });
    }

    function atualizarEntregasEMetricas() {
      if (!motoboyLogado || !db) return;
      db.ref('ordens').once('value').then((snapshot) => {
        const data = snapshot.val();
        let baseOrdens = [];
        if (data) { for (let key in data) { let ordem = data[key]; ordem.idFB = key; baseOrdens.push(ordem); } }
        processarDados(baseOrdens);
      });
    }

    function processarDados(baseOrdens) {
      const minhasOrdens = baseOrdens.filter(r => r.motoboyNome === motoboyLogado.nome);
      const pendentes = minhasOrdens.filter(r => !r.concluido && !r.motoboyAceitou && !r.motoboyRecusou);
      const emAndamento = minhasOrdens.filter(r => !r.concluido && r.motoboyAceitou);
      const concluidas = minhasOrdens.filter(r => r.concluido);

      renderizarChamados(pendentes);

      // Filtro de Histórico
      const filtro = document.getElementById('mb-filtro-periodo').value;
      let ordensFiltradas = [];
      if (filtro === 'hoje') {
        const inicioHoje = new Date().setHours(0,0,0,0);
        ordensFiltradas = concluidas.filter(r => (r.timestamp || 0) >= inicioHoje);
      } else { ordensFiltradas = [...concluidas]; }

      ordensNoHistorico = ordensFiltradas.sort((a,b) => b.timestamp - a.timestamp); // Mais novas primeiro
      
      // Métricas de hoje
      const inicioHojeMétrica = new Date().setHours(0,0,0,0);
      const concluidasHoje = concluidas.filter(r => (r.timestamp || 0) >= inicioHojeMétrica);
      const faturadoHoje = concluidasHoje.reduce((acc, r) => acc + (r.val || 0), 0);
      
      document.getElementById('mb-faturamento-total').innerText = `R$ ${faturadoHoje.toFixed(2)}`;
      document.getElementById('mb-entregas-qtd').innerText = concluidasHoje.length;

      renderizarHistorico(ordensNoHistorico);
    }

    function renderizarChamados(pendentes) {
      const container = document.getElementById('box-chamados-dinamicos');
      if (pendentes.length === 0) { container.innerHTML = ''; return; }
      container.innerHTML = pendentes.map(r => `
          <div class="card-oferta" style="margin-bottom:15px;">
            <div style="font-size:0.9rem; font-weight:800;">🚨 NOVO CHAMADO DISPONÍVEL!</div>
            <div style="background:rgba(0,230,118,0.1); padding:10px; border-radius:10px; margin:10px 0; text-align:center;">
                <div style="font-size:0.6rem; color:var(--text-muted);">VALOR DO SERVIÇO</div>
                <div style="font-size:1.8rem; font-weight:900; color:var(--green);">R$ ${(r.val || 0).toFixed(2)}</div>
            </div>
            <div class="tl-box">
              <div class="tl-row"><div class="tl-bullet" style="background:var(--primary);"></div><div style="font-size:0.8rem;">Coleta: ${r.orig}</div></div>
              <div class="tl-row"><div class="tl-bullet" style="background:var(--green);"></div><div style="font-size:0.8rem;">Entrega: ${r.dest}</div></div>
            </div>
            <button class="btn-aceitar" onclick="aceitarCorrida('${r.idFB}')"><i class="fa-solid fa-check"></i> ACEITAR CHAMADO AGORA</button>
          </div>
      `).join('');
    }

    function aceitarCorrida(idFB) {
        if (!db || !idFB) return;
        db.ref('ordens/' + idFB).update({ motoboyAceitou: true, Etapa: 'a_caminho_coleta' }).then(() => { alert("Corrida aceita!"); atualizarEntregasEMetricas(); });
    }

    // ==================================================================
    // RENDERIZAÇÃO DO HISTÓRICO COM AÇÕES DE EXCLUSÃO E EDIÇÃO (SOLICITADO)
    // ==================================================================
    function renderizarHistorico(lista) {
      const histEl = document.getElementById('lista-historico-motoboy');
      if (lista.length === 0) {
        histEl.innerHTML = `<div class="empty-box">Nenhuma corrida finalizada no período selecionado.</div>`;
        return;
      }
      histEl.innerHTML = lista.map((r, index) => `
        <div class="card-historico" id="card-hist-${r.idFB}">
          <!-- Visualização Padrão -->
          <div id="view-hist-${r.idFB}">
              <div class="hist-header">
                <span class="hist-os">OS #${r.numOS || '---'}</span>
                <span class="hist-data">${r.dtStr}</span>
              </div>
              <div class="hist-body">
                <div><span class="hist-cli">${r.cli || 'Entregue'}</span><div style="font-size:0.7rem; color:var(--text-muted);">${r.orig.substring(0,25)}...</div></div>
                <div class="hist-val">R$ ${(r.val || 0).toFixed(2)}</div>
              </div>
              
              <!-- Botões de Ação Solicitados -->
              <div class="hist-actions">
                <button class="btn-action btn-edit" title="Corrigir Corrida" onclick="habilitarEdicaoHistorico('${r.idFB}')">
                  <i class="fa-solid fa-pencil"></i> Corrigir
                </button>
                <button class="btn-action btn-delete" title="Apagar Registro" onclick="apagarRegistroHistorico('${r.idFB}', '${r.numOS || index}')">
                  <i class="fa-solid fa-trash-can"></i> Apagar
                </button>
              </div>
          </div>

          <!-- Formulário de Edição Oculto (Solicitado) -->
          <div id="edit-hist-${r.idFB}" class="hidden">
              <div style="font-size:0.75rem; font-weight:800; margin-bottom:8px; color:var(--orange);">CORRIGIR REGISTRO</div>
              <div class="edit-form">
                  <label style="font-size:0.65rem; color:#AAA;">Valor da OS (R$):</label>
                  <input type="number" id="input-edit-val-${r.idFB}" class="edit-form-input" value="${r.val || 0}" step="0.01">
                  
                  <label style="font-size:0.65rem; color:#AAA;">Cliente / Nome Recebedor:</label>
                  <input type="text" id="input-edit-cli-${r.idFB}" class="edit-form-input" value="${r.cli || ''}" placeholder="Ex: Mercado">
                  
                  <div class="edit-form-btns">
                      <button class="btn-edit-save" onclick="salvarCorrecaoHistorico('${r.idFB}')">Gravar</button>
                      <button class="btn-edit-cancel" onclick="cancelarEdicaoHistorico('${r.idFB}')">Voltar</button>
                  </div>
              </div>
          </div>

        </div>
      `).join('');
    }

    // Ação: Habilitar o modo de edição no card (Troca tela de vista pelo form)
    function habilitarEdicaoHistorico(idFB) {
        document.getElementById(`view-hist-${idFB}`).classList.add('hidden');
        document.getElementById(`edit-hist-${idFB}`).classList.remove('hidden');
    }

    // Ação: Cancelar edição e voltar para a vista normal
    function cancelarEdicaoHistorico(idFB) {
        document.getElementById(`view-hist-${idFB}`).classList.remove('hidden');
        document.getElementById(`edit-hist-${idFB}`).classList.add('hidden');
        atualizarEntregasEMetricas(); // Restaura valores originais nos inputs
    }

    // Ação: Gravar correções no Firebase e recarregar
    function salvarCorrecaoHistorico(idFB) {
        if (!db || !idFB) return;
        const novoVal = parseFloat(document.getElementById(`input-edit-val-${idFB}`).value || 0);
        const novoCli = document.getElementById(`input-edit-cli-${idFB}`).value;

        if (novoVal < 0) return alert("O valor não pode ser negativo.");

        db.ref('ordens/' + idFB).update({
            val: novoVal,
            cli: novoCli
        }).then(() => {
            alert("Registro corrigido com sucesso!");
            atualizarEntregasEMetricas(); // Recarrega tudo
        }).catch(() => alert("Erro ao corrigir no banco de dados."));
    }

    // Ação: Apagar o registro do Firebase e remover o card (Com Alerta)
    function apagarRegistroHistorico(idFB, numOS) {
        if (!db || !idFB) return;
        
        const confirmacao = confirm(`⚠️ CÉSAR, ATENÇÃO!\n\nTem certeza que deseja APAGAR COMPLETAMENTE o registro da OS #${numOS}?\n\nIsso removerá o valor do seu repasse final.`);
        
        if (confirmacao) {
            db.ref('ordens/' + idFB).remove().then(() => {
                alert(`OS #${numOS} apagada com sucesso.`);

            }).catch(() => alert("Erro ao apagar no banco de dados."));
        }
    }
